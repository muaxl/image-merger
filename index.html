<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片拖拽排序拼接工具</title>
    <style>
        :root {
            --primary-color: #6C5CE7;
            --secondary-color: #A29BFE;
            --accent-color: #FD79A8;
            --light-color: #F8F9FA;
            --dark-color: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            padding: 20px;
            background: var(--light-color);
            color: var(--dark-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin: 15px 0 25px;
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 上传区域 - 修改为可拖拽排序 */
        .upload-area {
            border: 2px dashed var(--secondary-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            background: rgba(162, 155, 254, 0.05);
            min-height: 150px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
            position: relative;
        }

        .upload-area.empty {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .upload-area.empty p {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-top: 10px;
        }

        .upload-area.empty .icon {
            font-size: 2.5rem;
            color: var(--primary-color);
        }

        .upload-area:hover {
            background: rgba(162, 155, 254, 0.1);
            border-color: var(--primary-color);
        }

        /* 上传图片项 - 添加拖拽样式 */
        .uploaded-image {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            cursor: move;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .uploaded-image.dragging {
            z-index: 10;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            opacity: 0.8;
        }

        .uploaded-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* 结果展示区域 */
        .result-area {
            border: 2px solid var(--secondary-color);
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            background: rgba(162, 155, 254, 0.05);
            min-height: 150px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .result-area.has-result {
            display: flex;
        }

        .result-image {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 移除按钮 */
        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(253, 121, 168, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            z-index: 10;
            line-height: 1;
        }

        .remove-btn:hover {
            background: var(--accent-color);
            transform: scale(1.1);
        }

        /* 布局选择器 */
        .layout-selector {
            margin: 20px auto;
            display: flex;
            gap: 15px;
            justify-content: center;
            max-width: 400px;
        }

        .layout-selector label {
            padding: 15px 25px;
            background: var(--light-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            border: 1px solid #eee;
            font-weight: 500;
            flex: 1;
            max-width: 180px;
        }

        .layout-selector input:checked + label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        /* 操作按钮 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 18px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 54px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.3);
            background: var(--secondary-color);
        }

        button:disabled {
            background: #DFE6E9;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button .icon {
            font-size: 1.3rem;
        }

        /* 画布容器 */
        .canvas-container {
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: none;
            position: relative;
            border: 1px solid #eee;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #f9f9f9;
        }

        /* 加载动画 */
        .loader {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 12px;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loader-text {
            color: var(--primary-color);
            font-weight: 500;
            margin-top: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
                margin: 10px 0 20px;
            }

            .upload-area.empty {
                padding: 30px 15px;
            }

            .layout-selector {
                flex-direction: column;
                max-width: 300px;
            }

            .layout-selector label {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图片拖拽排序拼接工具</h1>
        
        <!-- 上传区域 -->
        <div class="upload-area empty" id="uploadArea">
            <div class="icon">📁</div>
            <p>点击或拖拽图片到此处上传</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
        </div>
        
        <!-- 布局选择 -->
        <div class="layout-selector">
            <label>
                <input type="radio" name="layout" value="horizontal" checked> 
                水平排列
            </label>
            <label>
                <input type="radio" name="layout" value="vertical"> 
                垂直排列
            </label>
        </div>
        
        <!-- 操作按钮 -->
        <div class="controls">
            <button id="mergeBtn" disabled>
                <span class="icon">🖼️</span>
                合并图片
            </button>
            <button id="downloadBtn" disabled>
                <span class="icon">⬇️</span>
                下载图片
            </button>
        </div>
        
        <!-- 结果展示区域 -->
        <div class="result-area" id="resultArea">
            <img src="" alt="合并结果" class="result-image" id="resultImage">
        </div>
        
        <!-- 画布容器（隐藏） -->
        <div class="canvas-container" id="canvasContainer">
            <div class="loader" id="loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">正在处理图片...</div>
            </div>
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>

    <script>
        // 全局状态管理
        const state = {
            imageFiles: [],
            activeReaders: 0,
            isProcessing: false,
            mergedImage: null,
            draggedItem: null,
            draggedIndex: -1,
            placeholder: null,
            dragStartX: 0,
            dragStartY: 0
        };

        // DOM元素引用
        const elements = {
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            mergeBtn: document.getElementById('mergeBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            canvasContainer: document.getElementById('canvasContainer'),
            resultCanvas: document.getElementById('resultCanvas'),
            ctx: document.getElementById('resultCanvas').getContext('2d'),
            resultArea: document.getElementById('resultArea'),
            resultImage: document.getElementById('resultImage'),
            loader: document.getElementById('loader')
        };

        // 初始化拖拽排序功能
        function initDragSort() {
            elements.uploadArea.addEventListener('mousedown', startDrag);
            elements.uploadArea.addEventListener('touchstart', startDrag, { passive: false });
            
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('touchmove', handleDrag, { passive: false });
            
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            
            // 创建拖拽占位元素
            state.placeholder = document.createElement('div');
            state.placeholder.className = 'uploaded-image';
            state.placeholder.style.visibility = 'hidden';
        }

        function startDrag(e) {
            // 只处理图片项的拖拽
            const target = e.target.closest('.uploaded-image');
            if (!target) return;
            
            e.preventDefault();
            
            // 设置拖拽状态
            state.draggedItem = target;
            state.draggedIndex = Array.from(elements.uploadArea.children)
                .filter(el => el.classList.contains('uploaded-image'))
                .indexOf(target);
            
            // 记录初始位置
            if (e.type === 'touchstart') {
                state.dragStartX = e.touches[0].clientX - target.getBoundingClientRect().left;
                state.dragStartY = e.touches[0].clientY - target.getBoundingClientRect().top;
            } else {
                state.dragStartX = e.clientX - target.getBoundingClientRect().left;
                state.dragStartY = e.clientY - target.getBoundingClientRect().top;
            }
            
            // 设置拖拽样式
            target.classList.add('dragging');
            target.style.position = 'absolute';
            target.style.zIndex = '1000';
            
            // 添加占位元素
            elements.uploadArea.insertBefore(state.placeholder, target.nextSibling);
        }

        function handleDrag(e) {
            if (!state.draggedItem) return;
            e.preventDefault();
            
            // 计算新位置
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            // 更新拖拽元素位置
            state.draggedItem.style.left = (clientX - state.dragStartX) + 'px';
            state.draggedItem.style.top = (clientY - state.dragStartY) + 'px';
            
            // 计算新的插入位置
            const items = Array.from(elements.uploadArea.querySelectorAll('.uploaded-image:not(.dragging)'));
            const closest = items.reduce((closest, child, index) => {
                const box = child.getBoundingClientRect();
                const offsetY = clientY - box.top - box.height / 2;
                
                if (offsetY < 0 && offsetY > closest.offsetY) {
                    return { offsetY: offsetY, element: child, index: index };
                } else {
                    return closest;
                }
            }, { offsetY: Number.NEGATIVE_INFINITY });
            
            // 更新占位元素位置
            if (closest.element) {
                const newIndex = closest.index;
                const currentIndex = Array.from(elements.uploadArea.children).indexOf(state.placeholder);
                
                if (newIndex !== currentIndex) {
                    elements.uploadArea.insertBefore(state.placeholder, closest.element);
                }
            }
        }

        function endDrag() {
            if (!state.draggedItem) return;
            
            // 恢复拖拽元素样式
            state.draggedItem.classList.remove('dragging');
            state.draggedItem.style.position = '';
            state.draggedItem.style.left = '';
            state.draggedItem.style.top = '';
            state.draggedItem.style.zIndex = '';
            
            // 将拖拽元素插入到占位元素位置
            if (state.placeholder.parentNode) {
                const newIndex = Array.from(elements.uploadArea.children).indexOf(state.placeholder);
                elements.uploadArea.insertBefore(state.draggedItem, state.placeholder);
                
                // 更新文件顺序
                if (newIndex !== state.draggedIndex) {
                    const file = state.imageFiles[state.draggedIndex];
                    state.imageFiles.splice(state.draggedIndex, 1);
                    state.imageFiles.splice(newIndex > state.draggedIndex ? newIndex - 1 : newIndex, 0, file);
                }
            }
            
            // 移除占位元素
            if (state.placeholder.parentNode) {
                elements.uploadArea.removeChild(state.placeholder);
            }
            
            // 重置状态
            state.draggedItem = null;
            state.draggedIndex = -1;
        }

        // 事件监听初始化
        function initEventListeners() {
            // 上传区域点击
            elements.uploadArea.addEventListener('click', (e) => {
                if (e.target === elements.uploadArea || e.target.classList.contains('icon') || e.target.tagName === 'P') {
                    elements.fileInput.click();
                }
            });

            // 拖拽上传
            elements.uploadArea.addEventListener('dragover', handleDragOver);
            elements.uploadArea.addEventListener('dragleave', handleDragLeave);
            elements.uploadArea.addEventListener('drop', handleFileDrop);

            // 文件选择
            elements.fileInput.addEventListener('change', handleFileSelect);

            // 合并按钮
            elements.mergeBtn.addEventListener('click', mergeImages);

            // 下载按钮
            elements.downloadBtn.addEventListener('click', downloadImage);
        }

        // 拖拽处理
        function handleDragOver(e) {
            e.preventDefault();
            elements.uploadArea.style.borderColor = 'var(--primary-color)';
            elements.uploadArea.style.background = 'rgba(162, 155, 254, 0.15)';
        }

        function handleDragLeave() {
            elements.uploadArea.style.borderColor = 'var(--secondary-color)';
            elements.uploadArea.style.background = state.imageFiles.length > 0 
                ? 'rgba(162, 155, 254, 0.05)' 
                : 'rgba(162, 155, 254, 0.05)';
        }

        function handleFileDrop(e) {
            e.preventDefault();
            handleDragLeave();
            handleFiles(e.dataTransfer.files);
        }

        // 文件处理
        function handleFileSelect(e) {
            handleFiles(e.target.files);
            e.target.value = ''; // 清除input值允许重复上传相同文件
        }

        function handleFiles(files) {
            if (state.isProcessing) return;

            const newFiles = Array.from(files)
                .filter(file => file.type.startsWith('image/'))
                .slice(0, 20);

            if (newFiles.length === 0) return;

            state.imageFiles = [...state.imageFiles, ...newFiles];
            updateUploadArea();
            checkButtonState();
        }

        // 更新上传区域显示
        function updateUploadArea() {
            elements.uploadArea.innerHTML = '';
            elements.uploadArea.classList.remove('empty');
            
            if (state.imageFiles.length === 0) {
                elements.uploadArea.classList.add('empty');
                elements.uploadArea.innerHTML = `
                    <div class="icon">📁</div>
                    <p>点击或拖拽图片到此处上传</p>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                `;
                elements.fileInput = document.getElementById('fileInput');
                return;
            }

            state.activeReaders = state.imageFiles.length;
            
            state.imageFiles.forEach((file, index) => {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    state.activeReaders--;
                    createUploadedThumbnail(e.target.result, index);
                    if (state.activeReaders === 0) {
                        checkButtonState();
                    }
                };

                reader.onerror = () => {
                    state.activeReaders--;
                    console.error(`图片加载失败: ${file.name}`);
                };

                reader.readAsDataURL(file);
            });

            // 重新添加文件input
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.id = 'fileInput';
            fileInput.multiple = true;
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            fileInput.addEventListener('change', handleFileSelect);
            elements.uploadArea.appendChild(fileInput);
            elements.fileInput = fileInput;
        }

        // 创建上传缩略图
        function createUploadedThumbnail(dataUrl, index) {
            const thumbnail = document.createElement('div');
            thumbnail.className = 'uploaded-image';
            
            const img = new Image();
            img.src = dataUrl;
            img.alt = `预览 ${index + 1}`;
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '&times;';
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                removeImage(index);
            });
            
            thumbnail.appendChild(img);
            thumbnail.appendChild(removeBtn);
            elements.uploadArea.insertBefore(thumbnail, elements.fileInput);
        }

        // 图片管理
        function removeImage(index) {
            state.imageFiles.splice(index, 1);
            updateUploadArea();
            checkButtonState();
        }

        function checkButtonState() {
            elements.mergeBtn.disabled = state.imageFiles.length < 2;
            elements.downloadBtn.disabled = !state.mergedImage;
        }

        // 图片合并
        async function mergeImages() {
            if (state.isProcessing) return;
            if (state.imageFiles.length < 2) return;

            state.isProcessing = true;
            elements.mergeBtn.disabled = true;
            elements.loader.style.display = 'flex';

            try {
                const layout = document.querySelector('input[name="layout"]:checked').value;
                const images = await loadImages(state.imageFiles);
                const canvasSize = calculateCanvasSize(images, layout);
                
                setupCanvas(canvasSize);
                drawImages(images, layout);
                
                // 压缩合并后的图片
                state.mergedImage = await new Promise((resolve) => {
                    elements.resultCanvas.toBlob(
                        blob => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.readAsDataURL(blob);
                        },
                        'image/jpeg',
                        0.8
                    );
                });
                
                // 显示结果区域
                showResult();
                checkButtonState();
            } catch (error) {
                console.error('图片合并失败:', error);
                alert('图片处理失败，请尝试减少图片数量或尺寸');
            } finally {
                state.isProcessing = false;
                elements.loader.style.display = 'none';
                elements.mergeBtn.disabled = false;
            }
        }

        function loadImages(files) {
            return Promise.all(files.map(file => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(file);
                    
                    img.onload = () => {
                        URL.revokeObjectURL(url); // 及时释放内存
                        resolve(img);
                    };
                    
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error(`图片加载失败: ${file.name}`));
                    };
                    
                    img.src = url;
                });
            }));
        }

        function calculateCanvasSize(images, layout) {
            if (layout === 'horizontal') {
                return {
                    width: images.reduce((sum, img) => sum + img.width, 0),
                    height: Math.max(...images.map(img => img.height))
                };
            } else {
                return {
                    width: Math.max(...images.map(img => img.width)),
                    height: images.reduce((sum, img) => sum + img.height, 0)
                };
            }
        }

        function setupCanvas(size) {
            // 限制最大尺寸为4000x4000
            const MAX_SIZE = 4000;
            const ratio = Math.min(
                MAX_SIZE / size.width, 
                MAX_SIZE / size.height,
                1
            );
            
            elements.resultCanvas.width = size.width * ratio;
            elements.resultCanvas.height = size.height * ratio;
            elements.canvasContainer.style.display = 'block';
        }

        function drawImages(images, layout) {
            elements.ctx.clearRect(0, 0, elements.resultCanvas.width, elements.resultCanvas.height);
            
            const scale = elements.resultCanvas.width / calculateOriginalSize(images, layout).width;
            
            if (layout === 'horizontal') {
                drawHorizontal(images, scale);
            } else {
                drawVertical(images, scale);
            }
        }

        function calculateOriginalSize(images, layout) {
            if (layout === 'horizontal') {
                return {
                    width: images.reduce((sum, img) => sum + img.width, 0),
                    height: Math.max(...images.map(img => img.height))
                };
            } else {
                return {
                    width: Math.max(...images.map(img => img.width)),
                    height: images.reduce((sum, img) => sum + img.height, 0)
                };
            }
        }

        function drawHorizontal(images, scale) {
            let x = 0;
            images.forEach(img => {
                const width = img.width * scale;
                const height = img.height * scale;
                elements.ctx.drawImage(img, x, 0, width, height);
                x += width;
            });
        }

        function drawVertical(images, scale) {
            let y = 0;
            images.forEach(img => {
                const width = img.width * scale;
                const height = img.height * scale;
                elements.ctx.drawImage(img, 0, y, width, height);
                y += height;
            });
        }

        // 显示结果
        function showResult() {
            elements.resultImage.src = state.mergedImage;
            elements.resultArea.classList.add('has-result');
        }

        // 触发下载
        function triggerDownload() {
            if (!state.mergedImage) return;
            
            const link = document.createElement('a');
            link.download = `merged-image-${Date.now()}.jpg`;
            link.href = state.mergedImage;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadImage() {
            if (state.mergedImage) {
                triggerDownload();
            }
        }

        // 初始化
        function init() {
            initEventListeners();
            initDragSort(); // 初始化拖拽排序功能
            checkButtonState();
        }

        // 启动应用
        init();
    </script>
</body>
</html>
